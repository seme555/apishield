apiVersion: apps/v1
kind: Deployment
metadata:
  name: apishield
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels:
      service: fastapi
  template:
    metadata:
      labels:
        service: fastapi
    spec:
      containers:
       - name: fastapi-service
         image: seme555/apishield
         imagePullPolicy: Always
         env:
          - name: POSTGRES_PASSWORD
            value: postgres
          - name: DATABASE_URL
            value: postgresql://postgres:postgres@db/db
          - name: TEST_DATABASE_URL
            value: postgresql://postgres:postgres@test-db/test-db
          - name: BASE_URL
            value: http://service-entrypoint:5000
          - name: APP_ENV
            value: development
          - name: JWT_REFRESH_SECRET_KEY
            value: JWT_REFRESH_SECRET_KEY_HERE
          - name: JWT_SECRET_KEY
            value: JWT_SECRET_KEY_HERE
          - name: ROLLBAR_ACCESS_TOKEN
            value: ROLLBAR_ACCESS_TOKEN_HERE
          - name: BUCKET_NAME
            value: BUCKET_NAME
          - name: OAUTH_CLIENT_ID
            value: CLIENT_ID
          - name: OAUTH_CLIENT_SECRET
            value: OAUTH_CLIENT_SECRET
          - name: MAIL_USERNAME
            value: norval.hahn60@ethereal.email
          - name: MAIL_PASSWORD
            value: NupfGHXtsUdgx36VuK
          - name: MAIL_FROM
            value: norval.hahn60@ethereal.email
          - name: MAIL_PORT
            value: "587"
          - name: MAIL_SERVER
            value: smtp.ethereal.email
          - name: MAIL_FROM_NAME
            value: Norval Hahn
